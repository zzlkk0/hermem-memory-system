name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mcp pyyaml
      - run: python -c "import py_compile; py_compile.compile('mcp/directory-integrity/server.py', doraise=True); print('Syntax OK')"
      - name: Check SKILL.md frontmatter
        run: |
          python -c "
          import yaml
          content = open('skills/hierarchical-memory/SKILL.md').read()
          assert content.startswith('---')
          end = content.index(chr(92)+'n---', 3)
          fm = yaml.safe_load(content[3:end])
          assert 'name' in fm and 'description' in fm
          assert len(fm['description']) <= 1024
          print('SKILL.md valid')
          "
